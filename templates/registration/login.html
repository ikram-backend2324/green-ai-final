{% extends "auth_base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<h2 class="auth-title" data-i18n="Welcome back">Welcome back</h2>
<p class="auth-subtitle" data-i18n="Sign in to your account">Sign in to your account</p>
<form method="post" action="{% url 'users:login' %}" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label class="form-label"><i class="fas fa-user"></i> <span data-i18n="Username">Username</span></label>
        <input type="text" name="username" class="form-input" placeholder="Enter your username" required autofocus>
    </div>
    <div class="form-group">
        <label class="form-label"><i class="fas fa-lock"></i> <span data-i18n="Password">Password</span></label>
        <div class="input-with-toggle">
            <input type="password" name="password" id="passwordInput" class="form-input" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" onclick="togglePassword()">
                <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
        </div>
    </div>
    <button type="submit" class="btn-auth">
        <i class="fas fa-sign-in-alt"></i> <span data-i18n="Sign In">Sign In</span>
    </button>
</form>
<div class="auth-divider"><span data-i18n="Don't have an account?">Don't have an account?</span></div>
<a href="{% url 'users:register' %}" class="btn-auth-secondary">
    <i class="fas fa-user-plus"></i> <span data-i18n="Create Account">Create Account</span>
</a>
<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
    else { input.type = 'password'; icon.className = 'fas fa-eye'; }
}
</script>
{% endblock %}
